<!DOCTYPE html>
<html>
    <head>
        <title>Traffic Signal</title>

        <style>
            .box {
            width: 200px;
            height: 400px;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;     
            gap: 15px;
            border-radius: 12%;
            }

            .circle {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            padding: 20px;
            }

        </style>
    </head>

    <body>
        <div class="box">
            <div class="circle" style="background-color:red"></div>
            <div class="circle" style="background-color:yellow"></div>
            <div class="circle" style="background-color:green"></div>
        </div>
    </body>
</html>
